<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | UM-SS Preview</title>
    <style>
      :root {
        --teal: #02a8b4;
        --navy: #102a43;
        --bg: #f6fbfb;
        --border: #d7e6e8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Noto Sans JP", "Hiragino Sans", Meiryo, sans-serif;
        background: var(--bg);
        color: var(--navy);
      }
      .card {
        width: min(100%, 420px);
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 10px 30px rgba(16, 42, 67, 0.06);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: #567080;
        font-size: 14px;
        line-height: 1.6;
      }
      label {
        display: block;
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 700;
      }
      input {
        width: 100%;
        height: 48px;
        margin-bottom: 16px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font: inherit;
        font-size: 16px;
      }
      button {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 10px;
        background: var(--teal);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .error {
        margin: 0 0 16px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #fff1f2;
        color: #be123c;
        font-size: 13px;
      }
      .error[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>プレビュー閲覧ログイン</h1>
      <p>共有されたユーザー名とパスワードを入力してください。</p>
      <div id="error" class="error" hidden>ユーザー名またはパスワードが正しくありません。</div>
      <form method="POST" action="/api/login">
        <input type="hidden" name="next" id="next" value="/" />
        <label for="username">ユーザー名</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">ログイン</button>
      </form>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const next = params.get("next") || "/";
      document.getElementById("next").value = next.startsWith("/") ? next : "/";
      if (params.get("error") === "1") {
        document.getElementById("error").hidden = false;
      }
    </script>
  </body>
</html>
